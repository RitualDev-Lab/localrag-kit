name: Bug Report
description: File a bug report or report unexpected behavior
title: "[BUG]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear and concise description of the issue.
      placeholder: Describe what happened...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the behavior.
      placeholder: |
        1. Run command '...'
        2. Provide input '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: OS, runtime, and package versions.
      placeholder: OS: Windows/Linux/macOS, Node/Python/Go version
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Stack Traces
      description: Paste any error outputs or logs.
