[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "localrag-kit"
version = "0.1.0"
description = "100% offline, privacy-first local RAG search and chat engine for documents and codebases."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "RitualDev Lab", email = "developer@ritualdev.in" },
]
keywords = ["local-rag",
    "offline-rag",
    "private-ai",
    "sqlite-vec",
    "document-search",
    "codebase-rag",
    "local-embeddings",
    "privacy-first"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0.0",
    "pathspec>=0.12.0",
    "pypdf>=5.0.0",
    "rich>=13.0.0",
    "numpy>=2.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
localrag = "localrag.cli:main"

[project.urls]
Homepage = "https://github.com/RitualDev-Lab/localrag-kit"
Documentation = "https://github.com/RitualDev-Lab/localrag-kit#readme"
Repository = "https://github.com/RitualDev-Lab/localrag-kit"
Issues = "https://github.com/RitualDev-Lab/localrag-kit/issues"
Changelog = "https://github.com/RitualDev-Lab/localrag-kit/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["localrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line length handled flexibly
    "F401",  # module init imports
    "F841",  # unused local variables in tests/fallbacks
    "E402",  # module level imports
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["F841", "E402"]

