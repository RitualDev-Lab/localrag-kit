[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "localrag-kit"
version = "0.1.0"
description = "100% offline, privacy-first local RAG search and chat engine for documents and codebases."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "RitualDev Lab", email = "dev@ritualdev.com" },
]
keywords = ["rag", "llm", "local-first", "offline", "search", "sqlite-vec", "embeddings", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.0.0",
    "pathspec>=0.12.0",
    "pypdf>=5.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
localrag = "localrag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["localrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
